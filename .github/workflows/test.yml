name: test

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Create test database
        working-directory: backend
        run: |
          python -c "
          import asyncio
          from sqlalchemy.ext.asyncio import create_async_engine
          async def main():
              engine = create_async_engine('postgresql+asyncpg://support:support@localhost:5432/postgres')
              async with engine.begin() as conn:
                  await conn.execute(__import__('sqlalchemy').text(
                      \"CREATE DATABASE support_test OWNER support\"))
                  await conn.execute(__import__('sqlalchemy').text(
                      \"GRANT ALL PRIVILEGES ON DATABASE support_test TO support\"))
              await engine.dispose()
          asyncio.run(main())
          "

      # conftest HF_HUB_OFFLINE=1 ile çalışır; embedding modelini önceden indir.
      - name: Pre-download embedding model
        working-directory: backend
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-small-en-v1.5')"

      - name: Write test .env
        working-directory: backend
        run: |
          cat > ../.env <<'EOF'
          DATABASE_URL=postgresql+asyncpg://support:support@localhost:5432/support
          TEST_DATABASE_URL=postgresql+asyncpg://support:support@localhost:5432/support_test
          GROQ_API_KEY=
          EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
          EMBEDDING_DIM=384
          JWT_SECRET=ci-secret
          CORS_ORIGINS=["http://localhost:3002"]
          EOF

      - name: Run tests
        working-directory: backend
        run: pytest -v

      - name: Lint
        working-directory: backend
        run: |
          black --check .
          ruff check .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
